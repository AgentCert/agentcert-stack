# LiteLLM Proxy Configuration
# Purpose: Gateway for autonomous agents to access LLMs with Langfuse tracing

# Model definitions
#
# The Azure entry's model_name/model fields are templated via os.environ/...
# (AZURE_OPENAI_DEPLOYMENT / LITELLM_AZURE_CHAT_MODEL). Those two vars were
# missing from docker-compose-litellm.yml's environment list (only
# AZURE_OPENAI_KEY/AZURE_OPENAI_ENDPOINT were forwarded), so they resolved to
# None *inside the container* regardless of what the host's .env contained.
# That tripped a real litellm bug: proxy_server.py's load_config does
# `if "ollama" in litellm_model_name and ...` with no null-guard, so a single
# entry with a None model name crashes proxy startup entirely -- for every
# model in model_list, not just the misconfigured one. Fixed by adding both
# vars to the compose file's environment list; this config can now carry the
# full multi-provider list (Gemini/Azure/OpenRouter) plus a local Ollama
# entry side by side without crashing, once real credentials are filled in
# for whichever providers you actually use.
model_list:
  # Gemini 3 Flash
  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_base: https://generativelanguage.googleapis.com/v1beta
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google's Gemini series model"
      context_window: 1000000
      max_output_tokens: 60000

  # Gemini 2.5 Flash
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_base: https://generativelanguage.googleapis.com/v1beta
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google's Gemini series model"
      context_window: 1000000
      max_output_tokens: 60000

  # Gemini 2.5 Flash Lite
  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_base: https://generativelanguage.googleapis.com/v1beta
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google's Gemini series model"
      context_window: 1000000
      max_output_tokens: 60000

  # Azure OpenAI GPT-4o
  # model_name = the alias agents request (AZURE_OPENAI_DEPLOYMENT in .env)
  # LITELLM_AZURE_CHAT_MODEL = azure/<your-deployment-name> (set by setup.sh)
  - model_name: os.environ/AZURE_OPENAI_DEPLOYMENT
    litellm_params:
      model: os.environ/LITELLM_AZURE_CHAT_MODEL
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_KEY
      api_version: os.environ/AZURE_OPENAI_API_VERSION
    model_info:
      description: "Azure OpenAI GPT-4o"
      context_window: 128000
      max_output_tokens: 16384

  # Azure OpenAI GPT-4o -- SECOND deployment entry, same real backend,
  # deliberately duplicated under the same model_name for cooldown
  # redundancy (not for load-balancing capacity).
  #
  # Why: litellm's Router tracks cooldowns per deployment id (a hash of
  # model_name + litellm_params, see router.py:_generate_model_id), and
  # should_retry_this_error() aborts the retry loop immediately -- before
  # num_retries is exhausted -- once zero deployments in a model_name group
  # are "healthy" (router_utils/cooldown_handlers.py). With only ONE
  # deployment behind "gpt-4o", 3 failures inside any 10s window
  # (allowed_fails/window_size below) cools down that single deployment and
  # every retry attempt for the next 60s (cooldown_time) short-circuits
  # regardless of num_retries. This bit us for real: litellm v1.82's
  # proxy-wide shared aiohttp session (see AIOHTTP_KEEPALIVE_TIMEOUT above)
  # occasionally hands back a stale/dead pooled connection, producing a
  # litellm.APIConnectionError that is a client-side connection-pool
  # artifact, not a real Azure outage -- so blackballing the only route to
  # Azure over it is actively counterproductive.
  #
  # A second, independently-tracked deployment id for the exact same
  # backend means one entry getting cooled down still leaves the other
  # "healthy", so num_retries actually gets to run instead of being cut
  # short. `timeout` is set explicitly here (vs. inherited from
  # router_settings.timeout below) purely so this entry's litellm_params
  # dict differs from the one above -- byte-identical params would hash to
  # the SAME deployment id and silently collapse back into one entry,
  # defeating the point. The value is otherwise a no-op (matches the
  # router-level default).
  - model_name: os.environ/AZURE_OPENAI_DEPLOYMENT
    litellm_params:
      model: os.environ/LITELLM_AZURE_CHAT_MODEL
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_KEY
      api_version: os.environ/AZURE_OPENAI_API_VERSION
      timeout: 600
    model_info:
      description: "Azure OpenAI GPT-4o (redundant deployment id for cooldown isolation)"
      context_window: 128000
      max_output_tokens: 16384

  # OpenRouter Free Tier
  - model_name: auto-free
    litellm_params:
      model: openrouter/openrouter/free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Local open-weight model via Ollama — no external API key needed. Ollama
  # runs on the HOST (not in this compose network), so from inside the
  # litellm container it must be reached via the docker bridge IP, not
  # localhost/127.0.0.1 (which inside the container refers to the container
  # itself). ollama_chat/ is litellm's native Ollama chat-completions
  # provider (distinct from the older, non-chat ollama/ prefix).
  - model_name: qwen2.5-32b-instruct
    litellm_params:
      model: ollama_chat/qwen2.5:32b-instruct
      api_base: os.environ/OLLAMA_BASE_URL
      # Ollama's OWN default context window is 2048 tokens regardless of the
      # model's 32768 max, unless overridden per-request. flash-agent's
      # system prompt alone is ~2100 tokens (measured via _build_system_prompt),
      # before the 25 MCP tool schemas or any tool-result turns are added --
      # so without this, the context silently overflows/truncates by the
      # 2nd-3rd ReAct iteration, producing empty/invalid JSON and degenerate
      # tool calls (observed first-hand in a real test run).
      num_ctx: 32768
    model_info:
      description: "Local open-weight model via Ollama (CPU)"
      context_window: 32768

  # Qwen2.5-3B-Instruct — for hosts with a small (~4GB) GPU where the 32B/7B
  # tags don't fit in VRAM. Same truncation risk as above applies, but num_ctx
  # is kept at 8192 rather than 32768: at this model's GQA shape, KV cache is
  # roughly 36KB/token, so 32768 tokens would add ~1.2GB on top of the ~2GB
  # Q4_K_M weights -- too tight against a 4GB card alongside CUDA/OS overhead.
  # 8192 (~288MB of KV cache) still comfortably covers the system prompt +
  # tool schemas + several ReAct turns described above.
  - model_name: qwen2.5-32b-instruct
    litellm_params:
      model: ollama_chat/qwen2.5:32b-instruct
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 8192
    model_info:
      description: "Local open-weight model via Ollama (small-VRAM GPU, e.g. 4GB laptop cards)"
      context_window: 8192

# General proxy settings
general_settings:
  # Master key for accessing the proxy
  # Agents use THIS key
  master_key: os.environ/LITELLM_MASTER_KEY

  allow_requests_on_db_unavailable: True

# LiteLLM core settings
litellm_settings:
  # Enable Langfuse tracing (clean generation-only spans)
  callbacks: ["langfuse"]
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  
  # Request timeout (10 minutes)
  request_timeout: 600
  
  # Enable detailed logging for debugging
  set_verbose: true
  
  # Drop parameters not supported by target model
  drop_params: true

  # Number of retries on failure. This is the ONLY retry knob that covers
  # litellm.APIConnectionError (the class of error a stale pooled aiohttp
  # connection raises -- see AIOHTTP_KEEPALIVE_TIMEOUT below): litellm's
  # typed router_settings.retry_policy (per-exception-type retry counts)
  # only recognizes AuthenticationError/Timeout/RateLimitError/
  # ContentPolicyViolationError/BadRequestError (verified against the
  # installed v1.82.0 by reading router_utils/get_retry_from_policy.py --
  # APIConnectionError isn't one of the isinstance() checks there, so a
  # retry_policy entry for it would silently never fire). Raised from 3 to 5
  # for extra margin against that specific failure mode; applies to every
  # exception type uniformly since that's the only lever available here.
  num_retries: 5

  # Timeout between retries
  retry_after: 2

  # Default model if none specified
  default_model: "qwen2.5-32b-instruct"

# Callback-specific settings
callback_settings:
  langfuse:
    # Langfuse keys are read from environment variables:
    # - LANGFUSE_PUBLIC_KEY
    # - LANGFUSE_SECRET_KEY  
    # - LANGFUSE_HOST (defaults to https://cloud.langfuse.com)
    
    # Log complete request/response
    log_raw_request_response: true
    
    # Include function call data
    log_function_call: true

# Router settings (optional)
router_settings:
  # Disabled: was triggering a background health-check scheduler in LiteLLM
  # v1.82 that pinged every configured model every ~5 min and logged each
  # probe to Langfuse (tag: litellm-internal-health-check), generating
  # thousands of spurious traces with no user benchmarking running.
  # Reactive failure handling (allowed_fails + cooldown_time below) is
  # sufficient for routing correctness without the background polling.
  enable_pre_call_checks: false
  
  # Timeout for model availability checks
  allowed_fails: 3
  
  # Reset window for failures
  window_size: 10

  # Cooldown period for failed models
  cooldown_time: 60
  
  # Routing strategy
  routing_strategy: "simple-shuffle"
  
  # Timeout for health checks and requests (seconds). This is a SEPARATE knob from
  # litellm_settings.request_timeout above -- LiteLLM's Router (used whenever a proxy
  # config declares model_list, which this one does) enforces its OWN per-call timeout
  # here, and it takes precedence over request_timeout for actual completions. Left at
  # the old default of 120 here would silently kill any CPU-served local model call that
  # takes longer than 2 minutes, even after raising the client's own timeout and
  # request_timeout -- reproduced directly: "litellm.Timeout: Connection timed out.
  # Timeout passed=120.0, time taken=120.001 seconds" on a real qwen2.5-7b-instruct call
  # via Ollama. Raised to match request_timeout above.
  timeout: 600
