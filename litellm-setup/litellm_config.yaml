# LiteLLM Proxy Configuration
# Purpose: Gateway for autonomous agents to access LLMs with Langfuse tracing

# Model definitions
model_list:
  # Gemini 3 Flash
  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_base: https://generativelanguage.googleapis.com/v1beta
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google's Gemini series model"
      context_window: 1000000
      max_output_tokens: 60000
  
  # Gemini 2.5 Flash
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_base: https://generativelanguage.googleapis.com/v1beta
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google's Gemini series model"
      context_window: 1000000
      max_output_tokens: 60000

  # Gemini 2.5 Flash Lite
  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_base: https://generativelanguage.googleapis.com/v1beta
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google's Gemini series model"
      context_window: 1000000
      max_output_tokens: 60000

  # OpenRouter Free Tier
  - model_name: auto-free
    litellm_params:
      model: openrouter/openrouter/free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

# General proxy settings
general_settings:
  # Master key for accessing the proxy
  # Agents use THIS key
  master_key: os.environ/LITELLM_MASTER_KEY

  allow_requests_on_db_unavailable: True

# LiteLLM core settings
litellm_settings:
  # Enable Langfuse OTEL tracing
  callbacks: ["langfuse_otel"]
  success_callback: ["langfuse_otel"]
  failure_callback: ["langfuse_otel"]
  
  # Request timeout (10 minutes)
  request_timeout: 600
  
  # Enable detailed logging for debugging
  set_verbose: true
  
  # Drop parameters not supported by target model
  drop_params: true
  
  # Number of retries on failure
  num_retries: 3
  
  # Timeout between retries
  retry_after: 2

  # Default model if none specified
  default_model: "gemini-3-flash"

# Callback-specific settings
callback_settings:
  langfuse_otel:
    # Langfuse keys are read from environment variables:
    # - LANGFUSE_PUBLIC_KEY
    # - LANGFUSE_SECRET_KEY  
    # - LANGFUSE_OTEL_HOST (defaults to https://cloud.langfuse.com)
    
    # OTEL service information
    service_name: "litellm-gateway"
    service_version: "2.1.0"

    # Log complete request/response
    log_raw_request_response: true
    
    # Include function call data
    log_function_call: true

    # Trace structure configuration
    trace_schema_version: "1.0"
    
    # Metadata enrichment
    enrich_metadata: true
    add_provider_info: true
    add_model_info: true
    add_token_counts: true
    add_latency_metrics: true

# Router settings (optional)
router_settings:
  # Enable routing and fallbacks
  enable_pre_call_checks: true
  
  # Timeout for model availability checks
  allowed_fails: 3
  
  # Reset window for failures
  window_size: 10

  # Cooldown period for failed models
  cooldown_time: 60
  
  # Routing strategy
  routing_strategy: "simple-shuffle"
  
  # Timeout for health checks
  timeout: 5
