version: '3.8'

services:
  # LiteLLM Proxy - Gateway for autonomous agents
  litellm-proxy:
    image: litellm/litellm:v1.82.0-stable
    container_name: litellm-proxy
    restart: unless-stopped
    
    # Enable host.docker.internal on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    ports:
      - "14000:4000"  # Proxy API endpoint (14000 avoids conflict with Langfuse on 4000)
    
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - litellm-data:/app/data
      # Patches litellm's Ollama chat transformation to recover from
      # malformed tool-call arguments JSON (trailing garbage after a valid
      # value) instead of crashing the request -- small open-weight models
      # occasionally emit this, and since the bad tool_call gets persisted
      # in conversation history, an unhandled crash here permanently wedges
      # any client that resends history on retry (e.g. Codex CLI's
      # `resume --last`). See patches/ollama_chat_transformation.py.
      - ./patches/ollama_chat_transformation.py:/usr/lib/python3.13/site-packages/litellm/llms/ollama/chat/transformation.py:ro
    
    environment:
      # OpenRouter API Key
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}

      # Gemini API Key
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # Azure OpenAI
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_API_KEY=${AZURE_OPENAI_KEY}
      # These two were missing despite litellm_config.yaml's Azure entry
      # referencing them for its model_name/model fields (os.environ/...).
      # Without them, both resolve to None inside the container, which trips
      # a real litellm bug in proxy_server.py's load_config:
      # `if "ollama" in litellm_model_name and ...` has no null-guard, so a
      # None model name crashes proxy startup entirely -- for every model in
      # model_list, not just the misconfigured Azure entry.
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
      - LITELLM_AZURE_CHAT_MODEL=${LITELLM_AZURE_CHAT_MODEL}
      # Also missing (doesn't trip the crash above since api_version isn't the
      # field that bug inspects, but without it real Azure calls would fail
      # with an API-version error instead of actually working).
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}

      # Langfuse Tracing Keys
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://host.docker.internal:4000}

      # Logging
      - LITELLM_LOG=DEBUG
    
    command: --config /app/config.yaml --port 4000 --detailed_debug
    
    healthcheck:
      # `curl` isn't installed in litellm/litellm:v1.82.0-stable -- the CMD itself
      # was failing to exec (not a real health failure), so Docker had been
      # reporting this container "unhealthy" for 20+ hours straight despite it
      # serving correct completions the entire time. python3 is present; use it.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  litellm-data:
    driver: local
