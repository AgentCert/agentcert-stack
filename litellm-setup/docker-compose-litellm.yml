version: '3.8'

services:
  # LiteLLM Proxy - Gateway for autonomous agents
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    
    ports:
      - "4000:4000"  # Proxy API endpoint
    
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - litellm-data:/app/data
    
    environment:
      # OpenRouter API Key
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}

      # Gemini API Key
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      
      # Langfuse Tracing Keys
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_OTEL_HOST=${LANGFUSE_OTEL_HOST:-https://cloud.langfuse.com}
      
      # OTEL Configuration
      - OTEL_SERVICE_NAME=litellm-proxy
      - OTEL_TRACER_NAME=agentcert
      
      # Logging
      - LITELLM_LOG=DEBUG
    
    command: --config /app/config.yaml --port 4000 --detailed_debug
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  litellm-data:
    driver: local
