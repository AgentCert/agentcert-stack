apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: otel
spec:
  mode: deployment
  replicas: 1
  
  # Inject Langfuse credentials
  env:
    - name: LANGFUSE_AUTH_HEADER
      valueFrom:
        secretKeyRef:
          name: langfuse-credentials
          key: auth-header
  
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
    
    exporters:
      otlphttp/langfuse:
        endpoint: https://cloud.langfuse.com/api/public/otel
        headers:
          Authorization: "Basic ${LANGFUSE_AUTH_HEADER}"
      
      debug:
        verbosity: detailed

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679
    
    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/langfuse, debug]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-service
  namespace: otel
spec:
  type: NodePort
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30418
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30417
    - name: health
      port: 13133
      targetPort: 13133
      nodePort: 30133
    - name: pprof
      port: 1777
      targetPort: 1777
      nodePort: 31777
    - name: zpages
      port: 55679
      targetPort: 55679
      nodePort: 30679

  selector:
    app.kubernetes.io/name: otel-collector-collector
---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-credentials
  namespace: otel
type: Opaque
stringData:
  auth-header: "your-langfuse-auth-header" # Replace with your actual Langfuse auth header
